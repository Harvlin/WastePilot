spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:wastepilot}?createDatabaseIfNotExist=true&sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD:wastepilot}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
wastepilot.security.cors-allowed-origins[0]=${CORS_ALLOWED_ORIGIN_0}
