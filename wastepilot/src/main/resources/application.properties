spring.application.name=wastepilot

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:wastepilot}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:wastepilot}
spring.datasource.password=${DB_PASSWORD:wastepilot}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.build.enabled=true
management.info.env.enabled=false

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:10MB}

logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:WARN}

# Security Configuration
wastepilot.security.cors-allowed-origins[0]=${CORS_ALLOWED_ORIGIN_0:http://localhost:5173}
wastepilot.security.max-upload-size-mb=10
wastepilot.security.allowed-upload-content-types[0]=image/png
wastepilot.security.allowed-upload-content-types[1]=image/jpeg
wastepilot.security.allowed-upload-content-types[2]=image/webp
wastepilot.security.rate-limit.enabled=true
wastepilot.security.rate-limit.requests-per-minute=120

# JWT — overridden by .env in production
wastepilot.security.jwt.secret=${JWT_SECRET:wastepilot-local-dev-secret-key-that-is-at-least-256-bits-long}
wastepilot.security.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:28800}
wastepilot.security.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}

# Google Gemini AI — overridden by .env in production
wastepilot.ai.gemini.api-key=${GEMINI_API_KEY:mock-gemini-key-for-local-dev}
wastepilot.ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash-lite}
wastepilot.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
