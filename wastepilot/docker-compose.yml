services:
  mysql:
    image: mysql:8.4
    container_name: wastepilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wastepilot}
      MYSQL_USER: ${DB_USER:-wastepilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in wastepilot/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in wastepilot/.env}
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wastepilot-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_SSL_MODE: ${DB_SSL_MODE:-DISABLED}
      DB_NAME: ${DB_NAME:-wastepilot}
      DB_USER: ${DB_USER:-wastepilot}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in wastepilot/.env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-28800}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in wastepilot/.env}
      SENSOR_INGEST_API_KEY: ${SENSOR_INGEST_API_KEY:?Set SENSOR_INGEST_API_KEY in wastepilot/.env}
      GEMINI_MODEL: ${GEMINI_MODEL:?Set GEMINI_MODEL in wastepilot/.env}
      CORS_ALLOWED_ORIGIN_0: ${CORS_ALLOWED_ORIGIN_0:?Set CORS_ALLOWED_ORIGIN_0 in wastepilot/.env}
    ports:
      - "${APP_EXTERNAL_PORT:-8088}:8080"

  adminer:
    image: adminer:latest
    container_name: wastepilot-adminer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_EXTERNAL_PORT:-8888}:8080"

volumes:
  mysql_data:
