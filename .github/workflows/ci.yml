name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    name: Backend — Java 21 / Maven
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_DATABASE: wastepilot
          MYSQL_USER: wastepilot
          MYSQL_PASSWORD: wastepilot-test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        working-directory: wastepilot
        env:
          WASTEPILOT_MYSQL_TEST_URL: "jdbc:mysql://127.0.0.1:3306/wastepilot?serverTimezone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true"
          WASTEPILOT_MYSQL_TEST_USER: wastepilot
          WASTEPILOT_MYSQL_TEST_PASSWORD: wastepilot-test-password
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp test

      - name: Verify backend Docker image builds
        run: docker build --tag wastepilot-ci ./wastepilot

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: wastepilot/target/surefire-reports/
          retention-days: 7

  frontend-test:
    name: Frontend — Node 20 / npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build (validate production bundle)
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_DATABASE: wastepilot
          MYSQL_USER: wastepilot
          MYSQL_PASSWORD: wastepilot-test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build backend
        working-directory: wastepilot
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp package -DskipTests

      - name: Start backend against MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: wastepilot
          DB_USER: wastepilot
          DB_PASSWORD: wastepilot-test-password
          DB_SSL_MODE: DISABLED
          CORS_ALLOWED_ORIGIN_0: http://127.0.0.1:4173
          JWT_SECRET: e2e-test-jwt-secret-that-is-at-least-256-bits-long-0001
          GEMINI_API_KEY: e2e-test-key
          GEMINI_MODEL: gemini-1.5-flash
          AUDIT_CHAIN_HMAC_KEY: e2e-test-audit-hmac-key-that-is-long-enough
        run: |
          nohup java -jar wastepilot/target/wastepilot-0.0.1-SNAPSHOT.jar > /tmp/wastepilot-backend.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wastepilot-backend.log
          exit 1

      - name: Seed supervisor account for RBAC E2E
        run: |
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"fullName":"E2E Supervisor","email":"e2e-supervisor@wastepilot.local","password":"SecurePass123!"}' \
            http://127.0.0.1:8080/api/v1/auth/signup
          sudo apt-get update
          sudo apt-get install --yes mysql-client
          mysql --host=127.0.0.1 --user=wastepilot --password=wastepilot-test-password wastepilot \
            --execute="UPDATE auth_users SET role='SUPERVISOR' WHERE email='e2e-supervisor@wastepilot.local'"

      - name: Build Spring-backed E2E bundle
        working-directory: frontend
        env:
          VITE_INTERNAL_API_PROVIDER: spring
          VITE_SPRING_API_BASE_URL: http://127.0.0.1:8080
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
